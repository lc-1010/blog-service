name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build
        run: go build ./...
      - name: Test Go
        run: go test ./...
      - name: Test dataset importer
        run: python3 -m unittest discover -s datasets -p 'test_*.py' -v
