definitions:
  app.Pager:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total_rows:
        type: integer
    type: object
  errcode.Error:
    type: object
  model.ArticleSwagger:
    properties:
      list:
        items:
          $ref: '#/definitions/model.BlogArticle'
        type: array
      pager:
        $ref: '#/definitions/app.Pager'
    type: object
  model.BlogArticle:
    properties:
      content:
        type: string
      cover_image_url:
        description: 封面图片地址
        type: string
      created_by:
        description: 创建人
        type: string
      created_on:
        description: 创建时间
        type: integer
      deleted_on:
        description: 删除时间
        type: integer
      desc:
        description: 文章简述
        type: string
      id:
        description: id
        type: integer
      is_del:
        description: 是否删除 0 未删 ， 1 已删
        type: integer
      modified_by:
        description: 修改人
        type: string
      modified_on:
        description: 修改时间
        type: integer
      state:
        description: 状态 0 禁用，1 启用
        type: integer
      tag_id:
        type: integer
      title:
        type: string
    type: object
  model.BlogTag:
    properties:
      created_by:
        description: 创建人
        type: string
      created_on:
        description: 创建时间
        type: integer
      deleted_on:
        description: 删除时间
        type: integer
      id:
        description: id
        type: integer
      is_del:
        description: 是否删除 0 未删 ， 1 已删
        type: integer
      modified_by:
        description: 修改人
        type: string
      modified_on:
        description: 修改时间
        type: integer
      name:
        type: string
      state:
        type: integer
    type: object
  model.CreateArticle:
    properties:
      content:
        minLength: 1
        type: string
      cover_image_url:
        type: string
      created_by:
        maxLength: 100
        minLength: 2
        type: string
      desc:
        maxLength: 255
        type: string
      state:
        enum:
        - 0
        - 1
        type: integer
      tag_id:
        type: integer
      title:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - content
    - created_by
    - tag_id
    - title
    type: object
  model.TagSwagger:
    properties:
      list:
        items:
          $ref: '#/definitions/model.BlogTag'
        type: array
      pager:
        $ref: '#/definitions/app.Pager'
    type: object
  model.UpdateArticle:
    properties:
      content:
        minLength: 1
        type: string
      cover_image_url:
        type: string
      desc:
        maxLength: 255
        type: string
      modified_by:
        maxLength: 100
        minLength: 2
        type: string
      tag_id:
        type: integer
      title:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - content
    - modified_by
    - tag_id
    - title
    type: object
  model.UpdateArticleState:
    properties:
      modified_by:
        maxLength: 100
        minLength: 2
        type: string
      state:
        enum:
        - 0
        - 1
        type: integer
    required:
    - modified_by
    - state
    type: object
  model.UpdateTagRequest:
    properties:
      created_by:
        description: 创建者
        maxLength: 100
        minLength: 3
        type: string
      id:
        description: 文章id"
        type: integer
      name:
        description: 标签名称
        maxLength: 100
        type: string
      state:
        description: 标签状态
        enum:
        - 0
        - 1
        type: integer
    type: object
info:
  contact: {}
  description: 博客公开服务
  title: 博客
  version: "1.0"
paths:
  /api/v1/articles:
    get:
      parameters:
      - description: 标题关键字
        in: query
        name: title
        type: string
      - description: 标签 ID
        in: query
        name: tag_id
        type: integer
      - default: 1
        description: 状态
        enum:
        - 0
        - 1
        in: query
        name: state
        type: integer
      - description: 管理员查询全部状态
        in: query
        name: all_states
        type: boolean
      - description: 页码
        in: query
        minimum: 1
        name: page
        type: integer
      - description: 每页数量
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/model.ArticleSwagger'
        "400":
          description: 请求错误
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errcode.Error'
      summary: 分页查询文章
    post:
      consumes:
      - application/json
      parameters:
      - description: 文章内容
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreateArticle'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/model.BlogArticle'
        "400":
          description: 请求错误
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errcode.Error'
      summary: 创建文章
  /api/v1/articles/{id}:
    delete:
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 请求错误
          schema:
            $ref: '#/definitions/errcode.Error'
        "404":
          description: 文章不存在
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errcode.Error'
      summary: 软删除文章
    get:
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/model.BlogArticle'
        "400":
          description: 请求错误
          schema:
            $ref: '#/definitions/errcode.Error'
        "404":
          description: 文章不存在
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errcode.Error'
      summary: 获取单篇文章
    put:
      consumes:
      - application/json
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 文章内容
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateArticle'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/model.BlogArticle'
        "400":
          description: 请求错误
          schema:
            $ref: '#/definitions/errcode.Error'
        "404":
          description: 文章不存在
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errcode.Error'
      summary: 全量更新文章
  /api/v1/articles/{id}/state:
    patch:
      consumes:
      - application/json
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 文章状态
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateArticleState'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/model.BlogArticle'
        "400":
          description: 请求错误
          schema:
            $ref: '#/definitions/errcode.Error'
        "404":
          description: 文章不存在
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errcode.Error'
      summary: 更新文章状态
  /api/v1/tags:
    get:
      parameters:
      - description: 标签名
        in: query
        maxLength: 100
        name: name
        type: string
      - default: 1
        description: 状态
        enum:
        - 0
        - 1
        in: query
        name: state
        type: integer
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: paage_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/model.TagSwagger'
        "400":
          description: 请求错误
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: 请求错误
          schema:
            $ref: '#/definitions/errcode.Error'
      summary: 获取多个标签
    post:
      parameters:
      - description: 标签信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateTagRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/model.BlogTag'
        "400":
          description: 请求错误
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: 请求错误
          schema:
            $ref: '#/definitions/errcode.Error'
      summary: 创建标签
    put:
      parameters:
      - description: 标签信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateTagRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/model.BlogTag'
        "400":
          description: 请求错误
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: 请求错误
          schema:
            $ref: '#/definitions/errcode.Error'
      summary: 更新标签
  /api/v1/tags/{id}:
    delete:
      parameters:
      - description: 标签id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            type: string
        "400":
          description: 请求错误
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: 请求错误
          schema:
            $ref: '#/definitions/errcode.Error'
      summary: 删除标签
swagger: "2.0"
